<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F43217'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Helvetica,Arial' font-weight='700' font-size='34' fill='%23fff'%3ER$%3C/text%3E%3C/svg%3E">
<title>Finanças · Edson Mota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: livro-caixa de trabalho. Barra lateral fixa com as áreas, conteúdo em grade de cartões densos; números sempre tabulares. */
:root{
  color-scheme: light;
  --bg:#F2F2F0; --surface:#ffffff; --surface-2:#F6F6F5; --line:#E4E4E2; --line-2:#D2D2CF;
  --ink:#0A0A0A; --ink-2:#4A4A48; --ink-3:#6B6B69;
  --accent:#F43217; --accent-text:#C4260F; --accent-ink:#ffffff; --accent-soft:#FFEDE8;
  --pf:#245fb0; --pf-soft:#e5eefa; --pj:#6b4fc9; --pj-soft:#efeafb;
  --s-rec:#2a78d6; --s-desp:#eb6834;
  --good:#0a8a0a; --good-soft:#e5f4e5; --warn:#b77800; --warn-soft:#fdf3dc; --crit:#c23232; --crit-soft:#fbe7e7;
  --display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,22,19,.05), 0 6px 24px rgba(20,22,19,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121212; --surface:#1B1B1A; --surface-2:#222221; --line:#2E2E2C; --line-2:#3C3C3A;
    --ink:#F0F0EE; --ink-2:#BDBDBA; --ink-3:#8A8A87;
    --accent:#FF4A2E; --accent-text:#FF7A60; --accent-ink:#ffffff; --accent-soft:#3A1A14;
    --pf:#7fb0f0; --pf-soft:#1b2a3d; --pj:#b3a2f2; --pj-soft:#272240;
    --s-rec:#3987e5; --s-desp:#d95926;
    --good:#3dbb3d; --good-soft:#173017; --warn:#f0b43a; --warn-soft:#352a12; --crit:#e66767; --crit-soft:#3a1c1c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212; --surface:#1B1B1A; --surface-2:#222221; --line:#2E2E2C; --line-2:#3C3C3A;
  --ink:#F0F0EE; --ink-2:#BDBDBA; --ink-3:#8A8A87;
  --accent:#FF4A2E; --accent-text:#FF7A60; --accent-ink:#ffffff; --accent-soft:#3A1A14;
  --pf:#7fb0f0; --pf-soft:#1b2a3d; --pj:#b3a2f2; --pj-soft:#272240;
  --s-rec:#3987e5; --s-desp:#d95926;
  --good:#3dbb3d; --good-soft:#173017; --warn:#f0b43a; --warn-soft:#352a12; --crit:#e66767; --crit-soft:#3a1c1c;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-variant-numeric:normal}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;padding:0 10px;line-height:1.2}
.brand small{display:block;font:500 12px var(--body);color:var(--ink-3);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.navsep{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 4px}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.dot.busy{background:var(--warn)} .dot.err{background:var(--crit)}
main{padding:24px clamp(16px,3vw,36px) 60px;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.top .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month b{font-variant-numeric:normal;font-family:var(--display);font-weight:700;min-width:142px;text-align:center;font-size:14px}
.ib{width:30px;height:30px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h .meta{font-size:12px;color:var(--ink-3)}
.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-variant-numeric:lining-nums proportional-nums;font-family:var(--display);font-size:25px;font-weight:700;margin-top:4px;letter-spacing:-.02em;white-space:nowrap}
.kpi .det{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--crit)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:5px}
.b-PF{background:var(--pf-soft);color:var(--pf)} .b-PJ{background:var(--pj-soft);color:var(--pj)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:0;cursor:pointer;white-space:nowrap}
.p-pago{background:var(--good-soft);color:var(--good)} .p-pendente{background:var(--warn-soft);color:var(--warn)} .p-atrasado{background:var(--crit-soft);color:var(--crit)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:14px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px}
.a-crit{border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:var(--crit-soft)} .a-crit .ic{background:var(--crit);color:#fff}
.a-warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft)} .a-warn .ic{background:var(--warn);color:#1a1200}
.a-info .ic{background:var(--accent);color:var(--accent-ink)}
.a-good{background:var(--good-soft)} .a-good .ic{background:var(--good);color:#fff}
.alert b{font-weight:600}
.alert p{margin:2px 0 0;color:var(--ink-2)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.row .t{min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--ink-3);font-size:12px}
.row .v{font-weight:600;text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.catrow{display:grid;grid-template-columns:minmax(0,150px) 1fr 96px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.catrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .v{text-align:right;font-weight:600}
.catrow .bar{height:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;white-space:nowrap}
td.muted{color:var(--ink-3)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.filters input{min-width:200px}
.totals{display:flex;flex-wrap:wrap;gap:22px;font-size:13px;color:var(--ink-2);padding:10px 2px 0}
.totals b{color:var(--ink);font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.split > div{padding:12px 14px}
.split > div + div{border-left:1px solid var(--line)}
.split dl{margin:8px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.split dt{color:var(--ink-2)} .split dd{margin:0;text-align:right;font-weight:600}
.split dd.tot{border-top:1px solid var(--line);padding-top:4px}
.split dt.tot{border-top:1px solid var(--line);padding-top:4px;color:var(--ink);font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:14px}
.check{display:flex;flex-direction:column;gap:4px}
.check label{display:flex;gap:10px;align-items:center;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:14px}
.check label:hover{background:var(--surface-2)}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.check .done{color:var(--ink-3);text-decoration:line-through}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .grid line{stroke:var(--line)}
.chart .hx .guide{opacity:0} .chart .hx:hover .guide{opacity:1}
.chart .hb:hover rect.m{filter:brightness(1.12)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:7px;max-width:240px;opacity:0;transition:opacity .08s;line-height:1.45}
#tip.on{opacity:1}
.goal{display:flex;flex-direction:column;gap:8px}
.goal .nums{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.goal .bar{height:12px}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--ink-3);width:20px;height:20px;border-radius:50%;line-height:1}
.chip button:hover{background:var(--line);color:var(--crit)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input,.inline select{padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0}
.editrow{display:grid;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.editrow input,.editrow select{padding:7px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);width:100%;min-width:0}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.state{max-width:520px;margin:12vh auto;text-align:center;padding:0 16px}
.state p{color:var(--ink-2)}
/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;background:rgba(10,12,10,.45);padding:5vh 14px;overflow:auto}
#modal.on{display:flex}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg .body{padding:16px 20px;display:grid;gap:12px}
.dlg footer{display:flex;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:grid;gap:5px}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%}
.fld textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--ink-3)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.mei-track{position:relative;height:16px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);margin:22px 0 26px}
.mei-track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.mei-track .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink-2)}
.mei-track .mk span{position:absolute;top:-17px;transform:translateX(-50%);font-size:11px;color:var(--ink-2);white-space:nowrap}
.mei-track .mk em{position:absolute;bottom:-18px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);font-style:normal;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.hlp{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-3);font:700 10px/1 var(--body);margin-left:5px;cursor:help;vertical-align:1px;flex:none}
.hlp:hover,.hlp:focus-visible{border-color:var(--accent);color:var(--accent-text)}
th .hlp{margin-left:3px}
/* previsão */
.pv{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:8px;align-items:center;padding:7px 12px 7px 16px;border-top:1px solid var(--line)}
.pv .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv .t small{font-size:12px;color:var(--ink-3)}
.pvin{width:100%;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;text-align:right;background:var(--surface);font-weight:600}
.pvin:focus{border-color:var(--accent);outline:none}
.prevcard{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:inherit;flex-wrap:wrap}
.prevcard:hover{border-color:var(--accent)}
/* início */
.rules{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.rules b{color:var(--ink)}
tr.proj td{color:var(--ink-2);background:var(--surface-2)}
.tiles .tile{display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.tile .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.tile .val{font-family:var(--display);font-variant-numeric:lining-nums proportional-nums;font-size:28px;font-weight:800;letter-spacing:-.02em}
.tile .sub{font-size:12.5px;color:var(--ink-3)}
.tile .bar{margin-top:8px}
.tile .tlink{margin-top:auto;padding-top:8px;font-size:13px;font-weight:600;text-decoration:none}
.t-good{border-top-color:var(--good)} .t-good .val{color:var(--good)}
.t-warn{border-top-color:var(--warn)}
.t-crit{border-top-color:var(--crit)} .t-crit .val{color:var(--crit)}
.ins{display:flex;flex-direction:column;gap:8px}
.in{display:flex;gap:14px;align-items:center;padding:12px 14px 12px 16px;border-radius:9px;background:var(--surface-2);border-left:4px solid var(--line-2)}
.in-b{flex:1;min-width:0}
.in-t{font-weight:600}
.in-x{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.in-i{font-size:13px;font-weight:600;margin-top:4px}
.in-a{flex:none}
.in-crit{border-left-color:var(--crit);background:var(--crit-soft)} .in-crit .in-t{color:var(--crit)}
.in-warn{border-left-color:var(--warn);background:var(--warn-soft)} .in-warn .in-i{color:var(--warn)}
.in-info{border-left-color:var(--accent)} .in-info .in-i{color:var(--accent-text)}
.in-good{border-left-color:var(--good);background:var(--good-soft)} .in-good .in-i{color:var(--good)}
.flow dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:14px}
.flow dt{color:var(--ink-2)} .flow dd{margin:0;text-align:right;font-weight:600;white-space:nowrap}
.flow dd small{font-weight:400;color:var(--ink-3)}
.flow .tot{border-top:1px solid var(--line);padding-top:7px;color:var(--ink);font-weight:700}
.partida{border:2px solid var(--accent);margin-bottom:14px}
.partida .inline{align-items:flex-start;margin:4px 0;flex-wrap:nowrap}
.partida .inline input[type=radio]{margin-top:3px;accent-color:var(--accent);width:auto;flex:none}
.partida .inline{font-weight:400;color:var(--ink)}
@media (max-width:640px){.in{flex-direction:column;align-items:flex-start}}
/* checklist do mês */
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px;box-shadow:var(--shadow)}
.quick input{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:15px;min-width:0}
.quick input.v{flex:0 1 130px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.strip .card{padding:14px 16px}
.strip .big{font-family:var(--display);font-variant-numeric:lining-nums proportional-nums;font-size:22px;font-weight:700;letter-spacing:-.02em}
.strip .of{font-size:12.5px;color:var(--ink-3)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.sec{padding:6px 0 4px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px 8px}
.sec-h .meta{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ck{display:grid;grid-template-columns:30px minmax(0,1fr) auto 28px;gap:8px;align-items:center;padding:7px 12px 7px 14px;border-top:1px solid var(--line)}
.ck.sub{padding-left:40px;background:var(--surface-2)}
.ck input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);cursor:pointer;margin:0}
.ck .t{min-width:0}
.ck .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck .t small{font-size:12px;color:var(--ink-3)}
.ck.done .t div{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.ck .val{border:0;background:transparent;font-weight:600;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;text-align:right}
.ck .val:hover{background:var(--surface-2);outline:1px dashed var(--line-2)}
.ck.done .val{color:var(--ink-3)}
.ck .vin{width:110px;padding:5px 8px;border:1px solid var(--accent);border-radius:7px;text-align:right;background:var(--surface)}
.ck .more{border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:6px;height:28px;font-size:16px;line-height:1}
.ck .more:hover{background:var(--surface-2);color:var(--ink)}
.lock{color:var(--ink-3);font-size:12px}
.go{color:var(--warn);font-weight:600;font-size:12px}
.ck.wait{opacity:.6}
@media (max-width:860px){.cols{grid-template-columns:1fr}.strip{grid-template-columns:1fr}}
@media (max-width:1020px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g3{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a span{font-size:13px}
  .navsep{display:none}
  .g2,.two{grid-template-columns:1fr}
  .three{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:44px minmax(0,1fr) auto}
  .row .act{grid-column:2/4;justify-self:start}
  .split{grid-template-columns:1fr}.split > div + div{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:420px){.g4{grid-template-columns:1fr}.kpi .val{font-size:22px}.catrow{grid-template-columns:110px 1fr 84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="app">
  <aside class="side">

<script src="config.js?v=1"></script>
<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o==null?null:o));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const kfmt=v=>{v=Number(v)||0;return Math.abs(v)>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':'R$ '+Math.round(v)};
const pct=v=>(isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:0}):'0')+'%';
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f?f(x):x)||0),0);
const uid=p=>(p||'x')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function parseBRL(s){s=String(s==null?'':s).trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?Math.round(n*100)/100:0}
function numIn(v){return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
const today=new Date();
const curYM=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
function addM(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')}
function mLabel(ym){const[y,m]=ym.split('-').map(Number);return MESES[m-1]+' '+y}
function mShort(ym){const[y,m]=ym.split('-').map(Number);return MES3[m-1]+(m===1?' '+String(y).slice(2):'')}
function diffM(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)}

/* ---------- estado ---------- */
const S={editVal:null,imp:null,impData:null,db:null,cfg:null,hist:{},meses:{},month:curYM,view:'painel',esc:'tudo',f:{q:'',ent:'',tipo:'',status:''},ready:false,err:null,slow:false,saving:0,saveErr:false,histRange:'tudo'};
const VIEWS=[
 ['inicio','Início','M3 11l9-8 9 8M5 9v11h5v-6h4v6h5V9'],
 ['mes','Contas do mês','M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9'],
 ['previsao','Próximo mês','M3 17l6-6 4 4 8-8M14 7h7v7'],
 ['empresa','Empresa · caixa','M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6'],
 ['metas','Reserva e metas','M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zm0-5a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
 ['historico','Histórico','M3 3v18h18M7 15l4-4 3 3 5-6'],
 ['-','Detalhes'],
 ['painel','Gráficos do mês','M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z'],
 ['lancamentos','Lançamentos','M4 6h16M4 12h16M4 18h10'],
 ['fixas','Contas fixas','M12 8v4l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z'],
 ['cartoes','Cartões','M3 6h18v12H3zM3 10h18'],
 ['ajustes','Ajustes','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2-1.2L14.5 3h-5l-.4 2.6a7.6 7.6 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2 1.2l.4 2.6h5l.4-2.6a7.6 7.6 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z']
];
const DEFAULT_CFG={versao:1,regime:'MEI',limitePJ:81000,tolerancia:20,pjAnterior:{},pjAnteriorNota:'',
 contas:[{id:'pf',nome:'Conta PF',ent:'PF'},{id:'pj',nome:'Conta PJ',ent:'PJ'}],cartoes:[],clientes:[],
 categorias:{PF:{despesa:['Moradia','Contas da casa','Mercado','Alimentação fora','Transporte','Saúde e treino','Cuidados pessoais','Assinaturas','Família','Lazer','Compras','Educação','Cartão (a detalhar)','Outros'],receita:['Salário','Freela na PF','Reembolso','Outros']},
  PJ:{despesa:['Impostos','Software e IA','Internet e infraestrutura','Freelancers','Equipamentos','Marketing e anúncios','Contador','Tarifas bancárias','Outros'],receita:['Clientes recorrentes','Projeto avulso','Outros']}},
 orcamento:{},recorrentes:[],metas:[],proLabore:{reservaPct:10}};

/* ---------- acesso aos dados ---------- */
const itens=m=>(S.meses[m]&&S.meses[m].itens)||[];
const cfg=()=>S.cfg||DEFAULT_CFG;
const cliente=id=>cfg().clientes.find(c=>c.id===id);
const meta=id=>cfg().metas.find(x=>x.id===id);
function contaNome(id){const c=cfg().contas.find(x=>x.id===id)||cfg().cartoes.find(x=>x.id===id);return c?c.nome:(id||'—')}
const isCard=id=>cfg().cartoes.some(c=>c.id===id);
function lugarNome(v){if(v==='PF')return 'PF';if(v==='PJ')return 'PJ';if(v==='wise')return 'Wise (euro)';if(String(v).startsWith('meta:')){const g=meta(v.slice(5));return g?g.nome:'Meta'}return v}
function entDe(v){if(v==='PF'||v==='PJ')return v;if(v==='wise')return 'PJ';const g=String(v).startsWith('meta:')&&meta(v.slice(5));return g?g.ent:'PF'}

function calc(m,esc){
  const it=itens(m), inE=x=>esc==='tudo'||x.ent===esc;
  const by=f=>sum(it.filter(f),x=>x.valor);
  const o={
    rec:by(x=>x.tipo==='receita'&&inE(x)),
    desp:by(x=>x.tipo==='despesa'&&inE(x)),
    retir:by(x=>x.tipo==='transf'&&x.de==='PJ'&&x.para==='PF'),
    aportes:by(x=>x.tipo==='transf'&&String(x.para).startsWith('meta:')&&inE(x)),
    aPagar:by(x=>x.tipo==='despesa'&&x.status!=='pago'&&inE(x)),
    aReceber:by(x=>x.tipo==='receita'&&x.status!=='pago'&&inE(x)),
    recPJ:by(x=>x.tipo==='receita'&&x.ent==='PJ'),despPJ:by(x=>x.tipo==='despesa'&&x.ent==='PJ'),
    recPF:by(x=>x.tipo==='receita'&&x.ent==='PF'),despPF:by(x=>x.tipo==='despesa'&&x.ent==='PF'),
    aportePF:by(x=>x.tipo==='transf'&&String(x.para).startsWith('meta:')&&x.ent==='PF'),
    aportePJ:by(x=>x.tipo==='transf'&&String(x.para).startsWith('meta:')&&x.ent==='PJ')
  };
  return o;
}
function serie(m){
  if(itens(m).length){const c=calc(m,'tudo');return {r:c.rec,g:c.desp,src:'sistema'}}
  const h=S.hist[m];return h?{r:h.r||0,g:h.g||0,src:'planilha'}:null;
}
function metaSaldo(g){let s=Number(g.saldoIni)||0;const ts=g.saldoTs||0;for(const m in S.meses){for(const x of itens(m)){if(x.tipo!=='transf'||x.hist)continue;if(ts&&!(x.pagoEm>ts))continue;if(x.para==='meta:'+g.id)s+=Number(x.valor)||0;if(x.de==='meta:'+g.id)s-=Number(x.valor)||0}}return s}
const WISE='wise';
function cot(){return Number(S.cotLive)||Number((cfg().cambio||{}).EUR)||5.6}
const isWise=x=>x&&x.conta===WISE;
const temWise=()=>(cfg().contas||[]).some(c=>c.id===WISE);
function eurOf(x){return x.eur!=null?Number(x.eur)||0:(Number(x.valor)||0)/cot()}
function saldoWiseEur(){const sd=cfg().saldos;if(!sd||!sd.wise)return null;let e=Number(sd.wise.eur)||0;const ts=sd.ts||0;
  for(const m in S.meses)for(const x of itens(m)){if(!(x.pagoEm>ts))continue;
    if(x.tipo==='transf'){if(x.de===WISE)e-=eurOf(x);if(x.para===WISE)e+=eurOf(x);continue}
    if(x.status!=='pago'||!isWise(x))continue;if(x.tipo==='receita')e+=eurOf(x);if(x.tipo==='despesa')e-=eurOf(x)}return e}
const eur0=v=>'€ '+(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
function fixosPJ(wise){const R=cfg().recorrentes.filter(r=>r.ent==='PJ'&&r.ativo!==false&&recParc(r,curYM)!==false&&(!!wise===(r.conta===WISE)));return {rec:sum(R.filter(r=>r.tipo==='receita'),r=>r.valor),desp:sum(R.filter(r=>r.tipo==='despesa'),r=>r.valor)}}
function migrarWise(){const C=S.cfg;C.contas=C.contas||[];if(!C.contas.some(c=>c.id===WISE))C.contas.push({id:WISE,nome:'Wise (euro)',ent:'PJ',moeda:'EUR'});
  for(const c of ['Repasses','Custo de câmbio'])if(!C.categorias.PJ.despesa.includes(c))C.categorias.PJ.despesa.push(c);
  C.cambio=C.cambio||{EUR:Math.round(cot()*100)/100};
  const ri=C.recorrentes.find(r=>r.cliente==='infinity'&&r.tipo==='receita');if(ri){ri.valor=2500;ri.conta=WISE}
  if(!C.recorrentes.some(r=>r.id==='r-repinf'))C.recorrentes.push({id:'r-repinf',desc:'Repasse Infinity',ent:'PJ',tipo:'despesa',cat:'Repasses',valor:500,dia:10,conta:WISE,cliente:'infinity',ativo:true});
  const touched=[];
  for(const m of Object.keys(S.meses).sort()){const d=S.meses[m];if(!d||!d.itens)continue;const rec=d.itens.find(x=>x.tipo==='receita'&&(x.cliente==='infinity'||/infinity/i.test(x.desc||'')));if(!rec||Number(rec.valor)!==2000)continue;
    rec.valor=2500;rec.cliente='infinity';if(m>=curYM)rec.conta=WISE;
    if(!d.itens.some(x=>x.recId==='r-repinf'||x.mig==='repinf')){const it={id:uid('l'),dia:rec.dia||10,desc:'Repasse Infinity',valor:500,tipo:'despesa',ent:'PJ',cat:'Repasses',conta:m>=curYM?WISE:'pj',cliente:'infinity',status:rec.status==='pago'?'pago':'pendente',mig:'repinf'};if(m>=curYM)it.recId='r-repinf';d.itens.push(it)}
    touched.push(m)}
  C.mig=Object.assign({},C.mig,{wise:true});saveCfg();touched.forEach(saveMonth);S._keepScroll=true;render();toast('Infinity atualizada em '+touched.length+' meses. Informe quanto tem na Wise em "Atualizar saldos".')}
function migBanner(){const C=cfg();if(!S.cfg||(C.mig&&C.mig.wise)||!C.clientes.some(k=>k.id==='infinity'))return '';
  return `<div class="banner"><div><b>Infinity em euro na Wise</b><div class="small muted">A Infinity paga o equivalente a R$ 2.500 em euro, R$ 500 vão para um repasse e R$ 2.000 ficam para você. Atualizo os meses desde que ela começou, e a Wise passa a ter saldo próprio, separado dos reais.</div></div><button class="btn pri" data-act="mig-wise">Atualizar</button></div>`}
function saldoConta(ent){const sd=cfg().saldos;if(!sd||!sd[ent])return null;let s=Number(sd[ent].valor)||0;const ts=sd.ts||0;
  for(const m in S.meses)for(const x of itens(m)){if(!(x.pagoEm>ts))continue;const v=Number(x.valor)||0;
    if(x.tipo==='transf'){if(x.de===ent)s-=v;if(x.para===ent)s+=v;continue}if(x.status!=='pago')continue;
    if(isWise(x))continue;if(x.tipo==='receita'&&x.ent===ent)s+=v;if(x.tipo==='despesa'&&x.ent===ent)s-=v}return s}
function custoFixoPJ(){return sum(cfg().recorrentes.filter(r=>r.ent==='PJ'&&r.tipo==='despesa'&&r.ativo!==false&&recParc(r,curYM)!==false),r=>r.valor)}
function receitaFixaPJ(){return sum(cfg().recorrentes.filter(r=>r.ent==='PJ'&&r.tipo==='receita'&&r.ativo!==false),r=>r.valor)}
function alvoCaixaPJ(){return Math.round(custoFixoPJ()*((cfg().caixaPJ||{}).meses||3)/100)*100}
function retiradaFixa(){return Number((cfg().proLabore||{}).fixo)||0}
function retiradaDoMes(m){const p=cfg().proLabore||{};if(p.porMes&&p.porMes[m]!=null)return Number(p.porMes[m])||0;if(p.inicio&&m<p.inicio)return 0;return Number(p.fixo)||0}
function custoVidaPF(m){const pv=prevComItens(m,6);const v=pv.length?sum(pv.map(k=>calc(k,'PF').desp))/pv.length:0;return v||calc(m,'PF').desp}
function reservaMeta(){return cfg().metas.find(x=>x.ent==='PF')}
function notaDe(k){if(!k)return {teto:false,modo:'nenhuma',valor:0};const d={geniodesk:{teto:true,modo:'valor'},elohim:{teto:true,modo:'fixo',valor:1900},infinity:{teto:true,modo:'nenhuma'}}[k.id]||{teto:k.ent==='PJ',modo:'valor'};
  return {teto:k.teto!=null?k.teto:d.teto,modo:k.notaModo||d.modo,valor:k.notaValor!=null?Number(k.notaValor):(d.valor||0)}}
function tetoAno(y){let entra=0,notas=0;const meses=[];for(let i=1;i<=12;i++){const m=y+'-'+String(i).padStart(2,'0');let e=0,n=0;
    for(const x of itens(m)){if(x.tipo!=='receita')continue;const k=x.cliente&&cliente(x.cliente);
      if(k){const nd=notaDe(k);if(!nd.teto)continue;e+=Number(x.valor)||0;n+=nd.modo==='valor'?(Number(x.valor)||0):nd.modo==='fixo'?nd.valor:0}
      else if(x.ent==='PJ'){e+=Number(x.valor)||0}}
    entra+=e;notas+=n;meses.push({m,e,n,accE:entra,accN:notas})}
  return {entra,notas,meses}}
function pjAno(y){let s=Number((cfg().pjAnterior||{})[y])||0;for(const m in S.meses){if(m.startsWith(y+'-'))s+=calc(m,'PJ').rec}return s}
function mediaGastosPF(m){const vals=[];for(let i=0;i<3;i++){const k=addM(m,-i);if(itens(k).length)vals.push(calc(k,'PF').desp)}return vals.length?sum(vals)/vals.length:0}
function catTotals(m,esc){const t={};for(const x of itens(m)){if(x.tipo!=='despesa')continue;if(esc!=='tudo'&&x.ent!==esc)continue;const k=(esc==='tudo'?x.ent+' · ':'')+(x.cat||'Outros');t[k]=(t[k]||0)+(Number(x.valor)||0)}return Object.entries(t).sort((a,b)=>b[1]-a[1])}
function statusOf(x,m){if(x.status==='pago')return 'pago';if(m===curYM&&Number(x.dia)<today.getDate())return 'atrasado';if(diffM(m,curYM)>0)return 'atrasado';return 'pendente'}
const ST_LABEL={pago:'Pago',pendente:'Pendente',atrasado:'Atrasado'};
function stLabel(x,m){const s=statusOf(x,m);if(x.tipo==='receita')return s==='pago'?'Recebido':s==='atrasado'?'Não recebido':'A receber';return ST_LABEL[s]}

/* ---------- gravação ---------- */
const Q={};
function setSave(){const el=$('#savestate');if(!el)return;if(!S.db){el.innerHTML='<span class="dot err"></span>Sem conexão com o banco';return}
  el.innerHTML=(S.saveErr?'<span class="dot err"></span>Erro ao salvar':S.saving?'<span class="dot busy"></span>Salvando…':'<span class="dot"></span>Tudo salvo')+'<br><button class="btn sm ghost" data-act="logout" style="padding:4px 0;margin-top:6px">Sair</button>'}
function save(path,data){if(!S.db){toast('Sem conexão: a alteração não foi salva.');return}const q=Q[path]||(Q[path]={busy:false,next:null});q.next=clone(data);if(!q.busy)flush(path)}
async function flush(path){const q=Q[path];q.busy=true;S.saving++;setSave();
  while(q.next){const d=q.next;q.next=null;
    try{await S.db.doc(path).set(d);S.saveErr=false}
    catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await S.db.doc(path).set(d);S.saveErr=false;continue}catch(e2){e=e2}}
      S.saveErr=true;toast(errMsg(e))}}
  q.busy=false;S.saving--;setSave()}
function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return 'Só o dono desta página pode salvar alterações.';if(c==='quota_exceeded')return 'O banco desta página está cheio. Exporte um backup e apague meses antigos.';if(c==='resource_exhausted')return 'Muitas alterações seguidas. Espere alguns segundos e tente de novo.';if(c==='revoked')return 'O acesso a esta página mudou. Recarregue-a.';return 'Não foi possível salvar agora. Tente de novo em instantes.'}
function monthDoc(m){if(!S.meses[m])S.meses[m]={itens:[],rotina:{}};if(!S.meses[m].itens)S.meses[m].itens=[];return S.meses[m]}
function saveMonth(m){save('meses/'+m,S.meses[m])}
function saveCfg(){S.cfg=S.cfg||clone(DEFAULT_CFG);save('cfg/main',S.cfg)}
function upsertItem(m,item,oldM){if(oldM&&oldM!==m){const od=monthDoc(oldM);od.itens=od.itens.filter(x=>x.id!==item.id);saveMonth(oldM)}
  const d=monthDoc(m);const i=d.itens.findIndex(x=>x.id===item.id);if(i>=0)d.itens[i]=item;else d.itens.push(item);saveMonth(m);render()}
function deleteItem(m,id){const d=monthDoc(m);d.itens=d.itens.filter(x=>x.id!==id);saveMonth(m);render()}
function recParc(r,m){if(!r.parcTotal)return null;const n=diffM(r.parcIni,m)+1;if(n<1||n>r.parcTotal)return false;return n+'/'+r.parcTotal}
function pendentesFixas(m){const d=itens(m);return cfg().recorrentes.filter(r=>r.ativo!==false&&recParc(r,m)!==false&&!d.some(x=>x.recId===r.id))}
function gerarFixas(m){const list=pendentesFixas(m);if(!list.length){toast('As contas fixas deste mês já estão lançadas.');return}
  const PV=((cfg().prev||{})[m])||{};const d=monthDoc(m);for(const r of list){const p=recParc(r,m);const pv=(PV.v||{})['r:'+r.id];if(pv===0)continue;const it={id:uid('l'),dia:r.dia||1,desc:r.desc,valor:pv!=null?pv:r.valor,tipo:r.tipo,ent:r.ent,cat:r.cat,conta:r.conta,status:'pendente',recId:r.id};if(r.cliente)it.cliente=r.cliente;if(p)it.parc=p;d.itens.push(it)}
  for(const e of (PV.extras||[])){if(!(e.valor>0))continue;d.itens.push({id:uid('l'),dia:e.dia||1,desc:e.desc,valor:e.valor,tipo:e.tipo||'despesa',ent:e.ent||'PF',cat:e.cat||'Outros',conta:(e.ent||'PF')==='PJ'?'pj':'pf',status:'pendente',prevId:e.id})}
  d.rotina=d.rotina||{};d.rotina.contasFixas=true;saveMonth(m);toast(list.length+' contas fixas lançadas como pendentes em '+mLabel(m)+'.');render()}

let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),3400)}

document.addEventListener('mousemove',e=>{const tip=$('#tip');if(!tip.classList.contains('on'))return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px'});

/* ---------- gráficos ---------- */
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
function barsChart(pts,{h=220}={}){
  const W=720,H=h,pl=56,pr=8,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const mx=niceMax(Math.max(1,...pts.map(p=>p.v?Math.max(p.v.r,p.v.g):0)));
  const gw=iw/pts.length,bw=Math.max(4,Math.min(18,(gw-10)/2));
  let g='<g class="grid">';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${kfmt(mx*i/4)}</text>`}g+='</g>';
  pts.forEach((p,i)=>{const cx=pl+gw*i+gw/2;g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`;if(!p.v)return;
    const hr=ih*p.v.r/mx,hg=ih*p.v.g/mx,res=p.v.r-p.v.g;
    const tip=`<b>${esc(p.full)}</b><br>Receitas: ${brl(p.v.r)}<br>Gastos: ${brl(p.v.g)}<br>Resultado: ${brl(res)}<br><span style="opacity:.7">Fonte: ${p.v.src==='planilha'?'planilha antiga':'sistema'}</span>`;
    g+=`<g class="hb" data-tip="${esc(tip)}"><rect x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent"/>`;
    g+=bar(cx-bw-1,pt+ih-hr,bw,hr,'var(--s-rec)')+bar(cx+1,pt+ih-hg,bw,hg,'var(--s-desp)')+'</g>'});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e gastos por mês">${g}</svg>`;
  function bar(x,y,w,hh,c){if(hh<=0)return '';const r=Math.min(4,w/2,hh);return `<path class="m" d="M${x},${y+hh}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+hh}Z" fill="${c}"/>`}
}
function lineChart(pts,{h=260}={}){
  const W=900,H=h,pl=56,pr=10,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const vals=pts.filter(p=>p.v);const mx=niceMax(Math.max(1,...vals.map(p=>Math.max(p.v.r,p.v.g))));
  const X=i=>pl+(pts.length<2?iw/2:iw*i/(pts.length-1)),Y=v=>pt+ih-ih*v/mx;
  let g='<g class="grid">';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${kfmt(mx*i/4)}</text>`}g+='</g>';
  const path=k=>{let d='',pen=false;pts.forEach((p,i)=>{if(!p.v){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(p.v[k]).toFixed(1);pen=true});return d};
  const area=()=>{let segs=[],cur=[];pts.forEach((p,i)=>{if(p.v)cur.push([X(i),Y(p.v.r)]);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);return segs.map(s=>'M'+s[0][0]+','+(pt+ih)+s.map(q=>'L'+q[0].toFixed(1)+','+q[1].toFixed(1)).join('')+'L'+s[s.length-1][0]+','+(pt+ih)+'Z').join('')};
  g+=`<path d="${area()}" fill="var(--s-rec)" opacity=".09"/><path d="${path('r')}" fill="none" stroke="var(--s-rec)" stroke-width="2" stroke-linejoin="round"/><path d="${path('g')}" fill="none" stroke="var(--s-desp)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const [y,m]=p.ym.split('-');if(m==='01')g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${y}</text><line x1="${X(i)}" x2="${X(i)}" y1="${pt+ih}" y2="${pt+ih+4}" stroke="var(--line-2)"/>`});
  const step=pts.length>1?iw/(pts.length-1):iw;
  pts.forEach((p,i)=>{if(!p.v)return;const tip=`<b>${esc(mLabel(p.ym))}</b><br>Receitas: ${brl(p.v.r)}<br>Gastos: ${brl(p.v.g)}<br>Resultado: ${brl(p.v.r-p.v.g)}`;
    g+=`<g class="hx" data-tip="${esc(tip)}"><rect x="${X(i)-step/2}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/><line class="guide" x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${pt+ih}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><circle class="guide" cx="${X(i)}" cy="${Y(p.v.r)}" r="4" fill="var(--s-rec)" stroke="var(--surface)" stroke-width="2"/><circle class="guide" cx="${X(i)}" cy="${Y(p.v.g)}" r="4" fill="var(--s-desp)" stroke="var(--surface)" stroke-width="2"/></g>`});
  const last=[...pts].reverse().find(p=>p.v);if(last){const i=pts.indexOf(last);g+=`<circle cx="${X(i)}" cy="${Y(last.v.r)}" r="4" fill="var(--s-rec)" stroke="var(--surface)" stroke-width="2"/><circle cx="${X(i)}" cy="${Y(last.v.g)}" r="4" fill="var(--s-desp)" stroke="var(--surface)" stroke-width="2"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e gastos ao longo dos anos">${g}</svg>`;
}

function kpi(lab,val,det,cls){return `<div class="card kpi"><div class="lab">${lab}</div><div class="val ${cls||''}">${val}</div>${det?`<div class="det">${det}</div>`:''}</div>`}
function alertBox(kind,title,text,action){const ic={crit:'!',warn:'!',info:'i',good:'✓'}[kind];return `<div class="alert a-${kind}"><span class="ic" aria-hidden="true">${ic}</span><div style="flex:1;min-width:0"><b>${title}</b>${text?`<p>${text}</p>`:''}</div>${action||''}</div>`}
function monthCtl(){return `<div class="month"><button class="ib" data-act="mes" data-n="-1" aria-label="Mês anterior">‹</button><b>${mLabel(S.month)}</b><button class="ib" data-act="mes" data-n="1" aria-label="Próximo mês">›</button></div>${S.month!==curYM?'<button class="btn sm ghost" data-act="mes-hoje">Ir para hoje</button>':''}`}

function fixasBanner(){const p=pendentesFixas(S.month),d=diffM(curYM,S.month);if(!p.length||d<-1||d>2)return '';
  return `<div class="banner"><div><b>${mLabel(S.month)} ainda não tem ${p.length} conta${p.length>1?'s':''} fixa${p.length>1?'s':''} lançada${p.length>1?'s':''}.</b><div class="small muted">Elas entram como pendentes; você ajusta o valor real (luz, mercado, faturas) quando pagar.</div></div><button class="btn pri" data-act="gerar">Lançar contas fixas</button></div>`}

/* ---------- PAINEL ---------- */
function vPainel(){
  const m=S.month,c=calc(m,S.esc),it=itens(m);
  let k='';
  if(S.esc==='PJ'){const lucro=c.rec-c.desp;
    k=kpi('Faturou',brl(c.rec),c.aReceber?`${brl(c.aReceber)} ainda a receber`:'tudo recebido')+kpi('Custos da empresa',brl(c.desp),c.aPagar?`${brl(c.aPagar)} a pagar`:'tudo pago')+kpi('Lucro da empresa',brl(lucro),c.rec?`margem de ${pct(lucro/c.rec)}`:'',lucro>=0?'pos':'neg')+kpi('Retirado para a PF',brl(c.retir),`fica na empresa: ${brl(lucro-c.retir-c.aportePJ)}`);
  }else if(S.esc==='PF'){const ent=c.rec+c.retir,sobra=ent-c.desp;
    k=kpi('Entrou na PF',brl(ent),`salário ${brl(c.rec)} · retiradas da PJ ${brl(c.retir)}`)+kpi('Gastos pessoais',brl(c.desp),c.aPagar?`${brl(c.aPagar)} a pagar`:'tudo pago')+kpi('Sobrou',brl(sobra),ent?`${pct(sobra/ent)} do que entrou`:'',sobra>=0?'pos':'neg')+kpi('Guardado na reserva',brl(c.aportePF),metaReservaTxt());
  }else{const res=c.rec-c.desp;
    k=kpi('Receitas',brl(c.rec),c.aReceber?`${brl(c.aReceber)} a receber`:'tudo recebido')+kpi('Gastos (PF + PJ)',brl(c.desp),`PF ${brl(c.despPF)} · PJ ${brl(c.despPJ)}`)+kpi('Resultado do mês',brl(res),c.rec?`${pct(res/c.rec)} das receitas`:'',res>=0?'pos':'neg')+kpi('Guardado',brl(c.aportes),c.rec?`taxa de poupança ${pct(c.aportes/c.rec)}`:'');}
  const pts=[];for(let i=11;i>=0;i--){const ym=addM(m,-i);pts.push({label:mShort(ym),full:mLabel(ym),v:serie(ym)})}
  const venc=it.filter(x=>(x.tipo==='despesa'||x.tipo==='receita')&&x.status!=='pago'&&(S.esc==='tudo'||x.ent===S.esc)).sort((a,b)=>a.dia-b.dia);
  const cats=catTotals(m,S.esc).slice(0,9),cmax=cats.length?cats[0][1]:1;
  return header('Painel',`${mLabel(m)} · ${it.length} lançamentos`,monthCtl()+escCtl())+fixasBanner()+
  `<div class="grid g4">${k}</div>
  <div class="grid g-main" style="margin-top:14px">
    <div class="stack">
      <div class="card"><div class="card-h"><h2>Receitas × gastos, últimos 12 meses</h2><span class="meta">PF + PJ somados</span></div>${LEGEND}${barsChart(pts)}</div>
      <div class="card"><div class="card-h"><h2>Para onde foi o dinheiro</h2><span class="meta">${S.esc==='tudo'?'PF e PJ':S.esc==='PF'?'pessoa física':'empresa'}</span></div>
      ${cats.length?cats.map(([n,v])=>`<div class="catrow"><span class="n" title="${esc(n)}">${esc(n)}</span><div class="bar"><i style="width:${(v/cmax*100).toFixed(1)}%"></i></div><span class="v">${brl0(v)}</span></div>`).join(''):'<div class="empty">Sem gastos lançados neste mês.</div>'}</div>
      ${S.esc!=='PJ'?pfpjCard(c):''}
    </div>
    <div class="stack">
      ${alertas(m)}
      <div class="card"><div class="card-h"><h2>Em aberto no mês</h2><span class="meta">${venc.length} ${venc.length===1?'item':'itens'}</span></div>
      <div class="list">${venc.length?venc.map(x=>`<div class="row"><span class="d">dia ${esc(x.dia)}</span><div class="t"><div>${esc(x.desc)}</div><small>${badge(x.ent)} ${esc(x.cat||'')}</small></div><span class="v ${x.tipo==='receita'?'pos':''}">${x.tipo==='receita'?'+':''}${brl(x.valor)}</span><span class="act">${pill(x,m)}</span></div>`).join(''):'<div class="empty">Nada em aberto. Tudo pago e recebido.</div>'}</div></div>
      ${rotinaCard(m)}
    </div>
  </div>`;
}
function metaReservaTxt(){const g=cfg().metas.find(x=>x.ent==='PF');if(!g)return '';const s=metaSaldo(g);return `${esc(g.nome)}: ${brl0(s)} de ${brl0(g.alvo)}`}
function pfpjCard(c){const lucro=c.recPJ-c.despPJ,ent=c.recPF+c.retir;
  return `<div class="card"><div class="card-h"><h2>Pessoa física × empresa</h2><span class="meta">como o dinheiro passa de uma para a outra</span></div>
  <div class="split"><div>${badge('PJ')} <b>Empresa</b><dl><dt>Faturou</dt><dd>${brl(c.recPJ)}</dd><dt>Custos</dt><dd>− ${brl(c.despPJ)}</dd><dt class="tot">Lucro</dt><dd class="tot">${brl(lucro)}</dd><dt>Retirado para PF</dt><dd>− ${brl(c.retir)}</dd><dt>Ficou na empresa</dt><dd>${brl(lucro-c.retir-c.aportePJ)}</dd></dl></div>
  <div>${badge('PF')} <b>Pessoa física</b><dl><dt>Salário e outras</dt><dd>${brl(c.recPF)}</dd><dt>Retiradas da PJ</dt><dd>+ ${brl(c.retir)}</dd><dt>Gastos</dt><dd>− ${brl(c.despPF)}</dd><dt class="tot">Sobrou</dt><dd class="tot ${ent-c.despPF>=0?'pos':'neg'}">${brl(ent-c.despPF)}</dd><dt>Guardado</dt><dd>${brl(c.aportePF)}</dd></dl></div></div>
  ${c.retir===0&&lucro>0?`<div class="alert a-info" style="margin-top:12px"><span class="ic">i</span><div style="flex:1"><b>O lucro da empresa ainda não foi retirado.</b><p>Registre a retirada para que a PF pague as contas dela com dinheiro que saiu formalmente da PJ.</p></div><button class="btn sm" data-act="retirada">Registrar retirada</button></div>`:''}</div>`}
function alertas(m){const out=[],C=cfg(),y=m.slice(0,4);
  // MEI
  if(C.regime==='MEI'){const fat=pjAno(y),lim=Number(C.limitePJ)||81000,tol=lim*(1+(Number(C.tolerancia)||0)/100);const mesesRest=12-Number(m.slice(5));const proj=fat+calc(m,'PJ').rec*mesesRest;
    if(fat>tol)out.push(alertBox('crit',`Faturamento PJ de ${y} passou ${pct(fat/lim)} do teto do MEI`,`${brl0(fat)} contra ${brl0(lim)}. Acima de ${brl0(tol)} o desenquadramento costuma valer desde janeiro. Converse com um contador.`,'<a class="btn sm" href="#empresa">Ver</a>'));
    else if(proj>lim)out.push(alertBox('warn',`No ritmo atual a PJ fecha ${y} com ${brl0(proj)}`,`O teto do MEI é ${brl0(lim)}. Já faturou ${brl0(fat)} (${pct(fat/lim)}).`,'<a class="btn sm" href="#empresa">Ver</a>'));
    else if(fat>lim*.75)out.push(alertBox('warn',`PJ já usou ${pct(fat/lim)} do teto do MEI em ${y}`,`${brl0(fat)} de ${brl0(lim)}. Projeção para dezembro: ${brl0(proj)}.`,'<a class="btn sm" href="#empresa">Ver</a>'))}
  // comparação de gastos
  const cur=serie(m),prev=[1,2,3].map(i=>serie(addM(m,-i))).filter(Boolean);
  if(cur&&prev.length===3&&S.esc==='tudo'){const avg=sum(prev,p=>p.g)/3,d=cur.g/avg-1;if(d>.1)out.push(alertBox('warn',`Gastos ${pct(d)} acima da média dos 3 meses anteriores`,`${brl0(cur.g)} agora contra ${brl0(avg)} de média entre ${mShort(addM(m,-3))} e ${mShort(addM(m,-1))}.`))}
  // cartões
  if(S.esc!=='PJ'){const c=calc(m,'PF');const card=sum(itens(m).filter(x=>x.tipo==='despesa'&&x.ent==='PF'&&isCard(x.conta)),x=>x.valor);
    const semDet=sum(itens(m).filter(x=>x.tipo==='despesa'&&x.cat==='Cartão (a detalhar)'),x=>x.valor);
    if(c.desp&&card/c.desp>.35)out.push(alertBox('warn',`Cartões são ${pct(card/c.desp)} dos seus gastos pessoais`,semDet?`${brl0(semDet)} ainda está como “fatura a detalhar”. Lançar as compras do cartão por categoria mostra o que está pesando.`:'',`<a class="btn sm" href="#cartoes">Ver</a>`));
    for(const k of C.cartoes){if(!k.limite)continue;const f=sum(itens(m).filter(x=>x.conta===k.id&&x.tipo==='despesa'),x=>x.valor);if(f>k.limite*.8)out.push(alertBox(f>k.limite?'crit':'warn',`${esc(k.nome)}: fatura em ${pct(f/k.limite)} do limite`,`${brl0(f)} de ${brl0(k.limite)}.`))}}
  // orçamento
  for(const [key,lim] of Object.entries(C.orcamento||{})){const [e,cat]=key.split('|');if(S.esc!=='tudo'&&S.esc!==e)continue;const v=sum(itens(m).filter(x=>x.tipo==='despesa'&&x.ent===e&&x.cat===cat),x=>x.valor);if(lim&&v>lim)out.push(alertBox('warn',`${esc(cat)} passou do limite`,`${brl0(v)} de ${brl0(lim)} planejados (${e}).`))}
  // reserva
  const g=C.metas.find(x=>x.ent==='PF');if(g&&S.esc!=='PJ'){const s=metaSaldo(g),mg=mediaGastosPF(m);if(mg){const cob=s/mg;if(cob<6)out.push(alertBox(cob<3?'warn':'info',`Sua reserva cobre ${cob.toLocaleString('pt-BR',{maximumFractionDigits:1})} meses de gastos pessoais`,`O recomendado para quem tem renda de autônomo é de 6 a 12 meses. Faltam ${brl0(Math.max(0,mg*6-s))} para 6 meses.`,'<a class="btn sm" href="#metas">Ver</a>'))}
    if(calc(m,'PF').aportePF===0&&m<=curYM)out.push(alertBox('info','Nenhum aporte na reserva este mês',`A meta planejada é ${brl0(g.aporte)} por mês.`,`<button class="btn sm" data-act="aporte" data-meta="${esc(g.id)}">Aportar</button>`))}
  if(!out.length)out.push(alertBox('good','Nenhum alerta neste mês','Orçamentos, cartões e teto do MEI dentro do esperado.'));
  return `<div class="card"><div class="card-h"><h2>Atenção</h2><span class="meta">${out.length} ${out.length===1?'ponto':'pontos'}</span></div><div class="stack" style="gap:8px">${out.join('')}</div></div>`}
const ROTINA=[['contasFixas','Lançar as contas fixas do mês'],['receitas','Confirmar o que os clientes pagaram'],['faturas','Conferir faturas e trocar pelo valor real'],['retirada','Fazer a retirada PJ → PF'],['reserva','Aportar na reserva'],['revisao','Revisar o mês e anotar o que mudar']];
function rotinaCard(m){const r=(S.meses[m]&&S.meses[m].rotina)||{};const n=ROTINA.filter(([k])=>r[k]).length;
  return `<div class="card"><div class="card-h"><h2>Rotina do mês</h2><span class="meta">${n} de ${ROTINA.length}</span></div><div class="check">${ROTINA.map(([k,l])=>`<label><input type="checkbox" data-rot="${k}" ${r[k]?'checked':''}><span class="${r[k]?'done':''}">${l}</span></label>`).join('')}</div></div>`}

const N=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const RULES_PF=[['Família',['mae','mesada','pai ']],['Cartão (a detalhar)',['fatura','nubank','cartao']],['Moradia',['aluguel','condominio','iptu']],['Contas da casa',['telefone','internet','luz','energia','agua','gas','tv','claro','vivo']],['Mercado',['mercado','feira','padaria','acougue','hortifruti']],['Alimentação fora',['ifood','restaurante','lanche','almoco','jantar','pizza','cafe']],['Transporte',['uber','99','gasolina','combustivel','onibus','estacionamento','passagem','metro']],['Saúde e treino',['academia','muay','pilates','farmacia','remedio','medico','dentista','exame','consulta']],['Cuidados pessoais',['cabelo','barba','desodorante','shampoo','perfume','unha']],['Assinaturas',['spotify','netflix','youtube','apple','icloud','prime','disney','hbo']],['Educação',['curso','livro','faculdade','mentoria']],['Lazer',['cinema','show','bar','viagem','passeio','festa']],['Presentes',['presente','aniversario']],['Dízimo e doações',['dizimo','oferta','doacao']],['Compras',['roupa','tenis','sapato','loja','shopping','amazon','mercado livre','shopee']]];
const RULES_PJ=[['Impostos',['das','cnpj','imposto']],['Software e IA',['claude','freepik','chatgpt','adobe','canva','figma','envato','capcut','notion','ia ']],['Internet e infraestrutura',['internet','dominio','hospedagem','servidor']],['Equipamentos',['mac','notebook','monitor','camera','computador']],['Marketing e anúncios',['meta ads','anuncio','trafego','impulsion']],['Contador',['contador','contabil']],['Tarifas bancárias',['tarifa','taxa']]];
function guessCat(desc,ent,tipo){const n=' '+N(desc)+' ',C=cfg();
  if(tipo==='receita'){const k=C.clientes.find(c=>n.includes(N(c.nome)));if(k)return {cat:k.ent==='PF'?'Salário':'Clientes recorrentes',cliente:k.id,ent:k.ent};return {cat:ent==='PJ'?'Projeto avulso':'Outros'}}
  if(ent==='PJ'){const k=C.clientes.find(c=>c.ent==='PJ'&&n.includes(N(c.nome)));for(const [c,ks] of RULES_PJ)if(ks.some(x=>n.includes(x)))return {cat:c,cliente:k&&k.id};return {cat:'Freelancers',cliente:k&&k.id}}
  for(const [c,ks] of RULES_PF)if(ks.some(x=>n.includes(x)))return {cat:c};return {cat:'Outros'}}

/* ---------- PONTOS DE ATENÇÃO ---------- */
function prevComItens(m,n){const out=[];let k=addM(m,-1),guard=0;while(out.length<n&&guard<36){if(itens(k).length)out.push(k);k=addM(k,-1);guard++}return out}
const despCat=(m,e,c)=>sum(itens(m).filter(x=>x.tipo==='despesa'&&x.ent===e&&x.cat===c),x=>x.valor);
const cardSum=m=>sum(itens(m).filter(x=>x.tipo==='despesa'&&x.ent==='PF'&&(isCard(x.conta)||x.cat==='Cartão (a detalhar)')),x=>x.valor);
function insights(m){const out=[],C=cfg(),it=itens(m),prev=prevComItens(m,6),cur=m===curYM;const add=(sev,title,text,impact,action)=>out.push({sev,title,text,impact,action});
  const avg=f=>prev.length?sum(prev.map(f))/prev.length:0;
  // atrasadas
  const atr=it.filter(x=>x.tipo==='despesa'&&statusOf(x,m)==='atrasado');
  if(atr.length)add('crit',`${atr.length} ${atr.length>1?'contas atrasadas':'conta atrasada'}: ${brl0(sum(atr,x=>x.valor))}`,atr.slice(0,4).map(x=>esc(x.desc)).join(', ')+(atr.length>4?'…':''),'',`<a class="btn sm" href="#mes">Ver contas</a>`);
  // freelas liberados
  const recs=it.filter(x=>x.tipo==='receita'&&x.cliente&&x.status==='pago');
  const lib=it.filter(x=>x.tipo==='despesa'&&x.ent==='PJ'&&x.cliente&&x.status!=='pago'&&recs.some(r=>r.cliente===x.cliente));
  if(lib.length)add('warn',`Pode pagar ${lib.map(x=>esc(x.desc.split(' (')[0].split(' - ')[0])).join(' e ')}`,`${[...new Set(lib.map(x=>(cliente(x.cliente)||{}).nome))].join(' e ')} já pagou. Total: ${brl0(sum(lib,x=>x.valor))}.`,'',`<a class="btn sm" href="#mes">Marcar</a>`);
  // cartões
  const cs=cardSum(m),ca=avg(cardSum),pfD=calc(m,'PF').desp;
  if(ca&&cs>ca*1.15&&cs-ca>200)add(cs>ca*1.4?'crit':'warn',`Cartões ${pct(cs/ca-1)} acima do normal`,`${brl0(cs)} este mês contra ${brl0(ca)} de média nos últimos ${prev.length} meses. É ${pct(pfD?cs/pfD:0)} de tudo o que você gasta como pessoa física.`,`Voltar à média deixa ${brl0(cs-ca)} a mais no mês`,`<a class="btn sm" href="#cartoes">Ver cartões</a>`);
  // categorias PF que subiram / caíram
  const cats=[...new Set(it.filter(x=>x.tipo==='despesa'&&x.ent==='PF').map(x=>x.cat))].filter(c=>c!=='Cartão (a detalhar)');
  const sp=[],dn=[];for(const c of cats){const v=despCat(m,'PF',c),a=avg(k=>despCat(k,'PF',c));if(a>0&&v>a*1.25&&v-a>=150)sp.push([c,v,a]);if(a>0&&v<a*.8&&a-v>=150)dn.push([c,v,a])}
  sp.sort((a,b)=>(b[1]-b[2])-(a[1]-a[2])).slice(0,2).forEach(([c,v,a])=>add('warn',`${esc(c)} subiu ${pct(v/a-1)}`,`${brl0(v)} este mês. Sua média é ${brl0(a)}.`,`Voltar à média: +${brl0(v-a)} no mês`));
  // ferramentas da empresa
  const tl=despCat(m,'PJ','Software e IA'),ta=avg(k=>despCat(k,'PJ','Software e IA'));
  if(ta&&tl>ta*1.3&&tl-ta>=100){const lst=it.filter(x=>x.tipo==='despesa'&&x.ent==='PJ'&&x.cat==='Software e IA').map(x=>`${esc(x.desc)} ${brl0(x.valor)}`).join(', ');add('warn',`Ferramentas da empresa subiram para ${brl0(tl)}/mês`,`A média era ${brl0(ta)}. Hoje: ${lst}. Vale conferir se todas estão se pagando.`,`Cada R$ 100 cortado aqui vira R$ 1.200 no ano`)}
  // guardar
  const c=calc(m,'tudo'),sobra=c.rec-c.desp,g=reservaMeta();
  if(g&&c.aportes===0&&sobra>200&&diffM(m,curYM)>=0&&!((S.meses[m]||{}).rotina||{}).reserva){const sug=Math.max(100,Math.floor(sobra*.7/100)*100);add('warn',`Nada guardado em ${MESES[Number(m.slice(5))-1].toLowerCase()} ainda`,`A sobra prevista do mês é ${brl0(sobra)}. Guardar assim que o dinheiro entra funciona melhor do que esperar o fim do mês.`,`Sugestão: guardar ${brl0(sug)} agora`,`<button class="btn sm pri" data-act="aporte" data-meta="${esc(g.id)}" data-v="${sug}">Guardar ${brl0(sug)}</button>`)}
  // meta irreal
  if(g&&g.aporte){const sobras=prev.slice(0,3).map(k=>{const q=calc(k,'tudo');return q.rec-q.desp});const sm=sobras.length?sum(sobras)/sobras.length:sobra;
    if(sm>0&&g.aporte>sm*1.1){const nova=Math.max(100,Math.floor(sm*.7/100)*100);add('info',`Sua meta de guardar ${brl0(g.aporte)}/mês não cabe hoje`,`Nos últimos meses sobrou em média ${brl0(sm)}. Uma meta que você consegue cumprir todo mês vale mais do que uma que nunca bate.`,`Meta possível: ${brl0(nova)}/mês`,`<button class="btn sm" data-act="meta-ajusta" data-v="${nova}">Usar ${brl0(nova)}</button>`)}}
  // reserva
  if(g){const s=metaSaldo(g),mg=custoVidaPF(m);if(mg){const cob=s/mg;if(cob<6)add(cob<3?'crit':'warn',`Sua reserva cobre ${cob.toLocaleString('pt-BR',{maximumFractionDigits:1})} ${cob<2&&cob>=1?'mês':'meses'} de gastos`,`${brl0(s)} guardados para um custo de vida de ${brl0(mg)}/mês. Para quem vive de clientes, o seguro é ter de 6 a 12 meses.`,`Faltam ${brl0(Math.max(0,mg*6-s))} para 6 meses`,`<a class="btn sm" href="#metas">Ver reserva</a>`)}}
  // caixa da empresa
  const sPJ=saldoConta('PJ');if(sPJ!=null){const cf=custoFixoPJ(),alvo=alvoCaixaPJ();if(sPJ<cf)add('crit',`Caixa da empresa abaixo de 1 mês de custos`,`${brl0(sPJ)} no caixa para ${brl0(cf)} de custos fixos por mês. Segure as retiradas extras até passar disso.`,'',`<a class="btn sm" href="#empresa">Ver caixa</a>`);else if(sPJ<alvo)add('info',`Caixa da empresa: ${brl0(sPJ)} de ${brl0(alvo)}`,`A meta é ter 3 meses de custos guardados na empresa. O que sobra depois da sua retirada fixa vai para lá.`,`${pct(sPJ/alvo)} do caminho`,`<a class="btn sm" href="#empresa">Ver caixa</a>`)}
  // retirada
  const cp=calc(m,'PJ'),rdm=retiradaDoMes(m);if(rdm&&cp.retir<rdm&&cp.rec>0&&(!cur||today.getDate()>=10))add('info',`Faça sua retirada de ${brl0(rdm-cp.retir)} da empresa`,rdm!==retiradaFixa()?`Valor especial deste mês. A partir de ${mLabel((cfg().proLabore||{}).inicio||addM(m,1))} vale a retirada fixa de ${brl0(retiradaFixa())}.`:`É o seu "salário" da empresa. Sai da PJ para a PF uma vez por mês, sempre o mesmo valor.`,'',`<button class="btn sm" data-act="retirada">Registrar</button>`);
  // MEI
  if(C.regime==='MEI'){const y=m.slice(0,4),T=tetoAno(y),lim=Number(C.limitePJ)||81000,tol=lim*(1+(Number(C.tolerancia)||20)/100),fat=T.entra,proj=fat+cp.rec*(12-Number(m.slice(5)));
    const cruzN=T.meses.find(z=>z.accN>tol),cruzE=T.meses.find(z=>z.accE>tol);
    if(cruzN||cruzE){const z=cruzN||cruzE,prazo=addM(z.m,1);add('crit',`Teto do MEI estourado em ${y}`,`${cruzN?`Só pelas notas emitidas, passou de ${brl0(tol)} em ${mLabel(z.m).toLowerCase()} (${brl0(T.notas)} até agora).`:''} Contando tudo o que entra pelo seu trabalho: ${brl0(T.entra)}. Acima de 20% do teto, o desenquadramento volta a janeiro. O prazo para comunicar é o último dia útil de ${mLabel(prazo).toLowerCase()}.`,'Leve estes números a um contador esta semana',`<a class="btn sm" href="#empresa">Ver</a>`)}
    else if(fat>lim*1.2)add('crit',`Faturamento passou do teto do MEI`,`${brl0(fat)} em ${y}, teto de ${brl0(lim)}. Fale com um contador.`);else if(proj>lim*.85)add(proj>lim?'warn':'info',`Teto do MEI: ${pct(fat/lim)} usado em ${y}`,`Já faturou ${brl0(fat)}; no ritmo atual fecha o ano com ${brl0(proj)} (teto ${brl0(lim)}).`,'',`<a class="btn sm" href="#empresa">Ver</a>`)}
  // boa notícia
  if(dn.length){const [c2,v,a]=dn.sort((a,b)=>(b[2]-b[1])-(a[2]-a[1]))[0];add('good',`${esc(c2)} abaixo da média`,`${brl0(v)} este mês contra ${brl0(a)} de costume.`,`${brl0(a-v)} a mais no bolso`)}
  const ord={crit:0,warn:1,info:2,good:3};return out.sort((a,b)=>ord[a.sev]-ord[b.sev])}
function insightList(list,limit){const sh=S.allIns?list:list.slice(0,limit);

function prevLinhas(ym){const C=cfg(),last=addM(ym,-1),li=itens(last),PV=((C.prev||{})[ym])||{},V=PV.v||{},out=[];
  for(const r of C.recorrentes){if(r.ativo===false||recParc(r,ym)===false)continue;const lx=li.find(x=>x.recId===r.id);const base=Number(r.valor);
    out.push({key:'r:'+r.id,desc:r.desc+(r.parcTotal?' '+recParc(r,ym):''),tipo:r.tipo,ent:r.ent,cat:r.cat,conta:r.conta,cliente:r.cliente,ultimo:lx?Number(lx.valor):null,base,valor:V['r:'+r.id]!=null?V['r:'+r.id]:base,editado:V['r:'+r.id]!=null})}
  const avulsos=sum(li.filter(x=>x.tipo==='despesa'&&!x.recId&&x.ent==='PF'),x=>x.valor);
  out.push({key:'avulsos',desc:'Gastos avulsos (fora das contas fixas)',tipo:'despesa',ent:'PF',cat:'Outros',ultimo:avulsos,base:avulsos,valor:V.avulsos!=null?V.avulsos:avulsos,editado:V.avulsos!=null,nota:'o que você gastou fora da lista no mês passado'});
  for(const e of (PV.extras||[]))out.push({key:'x:'+e.id,extra:e.id,desc:e.desc,tipo:e.tipo||'despesa',ent:e.ent||'PF',cat:e.cat||'Outros',ultimo:null,base:0,valor:Number(e.valor)||0,editado:true});
  return out}
function prevCalc(ym){const L=prevLinhas(ym),fx=retiradaDoMes(ym);const s=(f)=>sum(L.filter(f),x=>x.valor);

  return {L,rec,desp,sobra:rec-desp,recPJ,despPJ,recPF,despPF,fx}}

function vInicio(){const m=S.month,C=cfg(),c=calc(m,'tudo'),cp=calc(m,'PJ'),cf=calc(m,'PF'),sobra=c.rec-c.desp;

function ckRow(x,m,o){o=o||{};const done=x.status==='pago';const meta=[];if(o.wait&&!done)meta.push(`<span class="lock">aguardando ${esc(o.wait)} pagar</span>`);else if(o.go&&!done)meta.push('<span class="go">pode pagar agora</span>');
  if((!o.wait&&!o.go)||(done&&o.wait)){meta.push('dia '+esc(x.dia));if(x.parc)meta.push(esc(x.parc));if(x.cat&&o.showCat)meta.push(esc(x.cat))}
  const val=S.editVal===x.id?`<input class="vin" id="vin" value="${numIn(x.valor)}" inputmode="decimal" data-id="${esc(x.id)}" aria-label="Novo valor">`:`<button class="val ${x.tipo==='receita'&&!done?'pos':''}" data-act="val" data-id="${esc(x.id)}" title="Toque para corrigir o valor">${brl(x.valor)}</button>`;
  return `<div class="ck ${done?'done':''} ${o.sub?'sub':''} ${o.wait&&!done?'wait':''}"><input type="checkbox" data-ck="${esc(x.id)}" ${done?'checked':''} aria-label="${x.tipo==='receita'?'Recebido':'Pago'}: ${esc(x.desc)}"><div class="t"><div>${esc(x.desc)}</div><small>${meta.join(' · ')}</small></div>${val}<button class="more" data-act="edit" data-id="${esc(x.id)}" aria-label="Detalhes de ${esc(x.desc)}">⋯</button></div>`}

  ${it.length?`<div class="cols"><div class="stack">
    <div class="card sec" style="padding:0"><div class="sec-h"><h2>Entradas</h2><span class="meta">${recs.filter(x=>x.status==='pago').length} de ${recs.length} recebidas</span></div>${ent||'<div class="empty">Nenhuma entrada prevista.</div>'}

function importBanner(){if(!S.impData||!S.cfg||S.cfg.importado)return '';const ks=Object.keys(S.impData.meses).sort();const novos=ks.filter(k=>!itens(k).length);if(!novos.length)return '';

async function importarPlanilha(){const d=S.impData;if(!d||S.imp)return;const ks=Object.keys(d.meses).sort().filter(k=>!itens(k).length);S.imp={done:0,total:ks.length};render();
  const cats={PF:{despesa:new Set(),receita:new Set()},PJ:{despesa:new Set(),receita:new Set()}};
  for(const k of ks){const doc={itens:d.meses[k],rotina:{},importado:true};for(const x of doc.itens)if(x.cat&&cats[x.ent]&&cats[x.ent][x.tipo])cats[x.ent][x.tipo].add(x.cat);
    let tries=0;while(true){try{await S.db.doc('meses/'+k).set(doc);break}catch(e){tries++;if(tries>4||!(e&&(e.code==='resource_exhausted'||e.code==='unavailable'))){S.imp=null;toast('A importação parou em '+mLabel(k)+'. '+errMsg(e)+' Clique de novo para continuar.');render();return}await new Promise(r=>setTimeout(r,1500*tries))}}
    S.meses[k]=doc;S.imp.done++;if(S.imp.done%6===0||S.imp.done===S.imp.total)render();await new Promise(r=>setTimeout(r,120))}
  for(const e of ['PF','PJ'])for(const t of ['despesa','receita'])for(const c of cats[e][t])if(!S.cfg.categorias[e][t].includes(c))S.cfg.categorias[e][t].push(c);
  if(S.cfg.pjAnteriorNota)S.cfg.pjAnteriorNota='';S.cfg.pjAnterior={};S.cfg.importado=new Date().toISOString().slice(0,10);saveCfg();S.imp=null;render();toast(ks.length+' meses importados da planilha.')}

  const proxF=[];let run=fim,runW=wE;for(let i=1;i<=3;i++){const k=addM(curYM,i);const rk=retiradaDoMes(k);const cv=temWise()?Math.max(0,fB.desp+rk-fB.rec):0;run=run==null?null:run+fB.rec+cv-fB.desp-rk;runW=runW==null?null:runW+(fW.rec-fW.desp-cv)/cot();proxF.push({k,ent:fB.rec+cv,cv,sai:fB.desp,ret:rk,fim:run,w:runW})}

  </div>

    <div class="grid g3" style="align-items:start"><div><div class="small muted">Saldo</div><div style="font:800 26px var(--display)">${wE==null?'—':eur0(wE)}</div><div class="small muted">${wE==null?'informe em "Atualizar saldos"':'≈ '+brl0(wE*cot())}</div></div>

    <div class="inline" style="margin-top:12px"><button class="btn pri" data-act="converter">Registrar conversão para real</button><span class="hint">O resto fica guardado em euro. Converta sempre no mesmo dia do mês, sem tentar adivinhar o melhor câmbio.</span></div></div>`:''}
   <div class="card"><div class="card-h"><h2>Quanto cada cliente deixa</h2><span class="meta">${mLabel(m)}</span></div>

    <dl style="display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:14px"><dt>Pelas notas emitidas</dt><dd style="margin:0;text-align:right;font-weight:700" class="${TT.notas>tol?'neg':''}">${brl0(TT.notas)} <small class="muted">${pct(TT.notas/lim)} do teto</small></dd><dt>Tudo o que entra pelo seu trabalho</dt><dd style="margin:0;text-align:right;font-weight:700" class="${TT.entra>tol?'neg':''}">${brl0(TT.entra)} <small class="muted">${pct(TT.entra/lim)}</small></dd></dl><p class="small" style="margin:8px 0 0">O teto conta a receita bruta da atividade, com ou sem nota e em qualquer conta. A barra mostra tudo o que entra. Confirme com um contador.</p>`:'<p class="muted">Seu regime não é MEI.</p>'}
    ${pjBars(bars,lim/12)}</div>

function pjBars(b,ref){const W=560,H=200,pl=52,pt=10,pb=24,iw=W-pl-8,ih=H-pt-pb;const mx=niceMax(Math.max(ref*1.2,...b.map(x=>x.v||0)));const gw=iw/12,bw=Math.min(26,gw-8);
  let g='<g class="grid">';for(let i=0;i<=4;i++){const yy=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-8}" y1="${yy}" y2="${yy}"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${kfmt(mx*i/4)}</text>`}g+='</g>';
  b.forEach((x,i)=>{const cx=pl+gw*i+gw/2;g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${MES3[i]}</text>`;if(x.v==null)return;const hh=ih*x.v/mx;const r=Math.min(4,hh);const xx=cx-bw/2,yy=pt+ih-hh;
   g+=`<g class="hb" data-tip="${esc('<b>'+mLabel(x.ym)+'</b><br>'+brl(x.v))}"><rect x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent"/>${hh>0?`<path class="m" d="M${xx},${yy+hh}V${yy+r}Q${xx},${yy} ${xx+r},${yy}H${xx+bw-r}Q${xx+bw},${yy} ${xx+bw},${yy+r}V${yy+hh}Z" fill="var(--pj)"/>`:''}</g>`});
  const ry=pt+ih-ih*ref/mx;g+=`<line x1="${pl}" x2="${W-8}" y1="${ry}" y2="${ry}" stroke="var(--crit)" stroke-dasharray="4 4"/><text x="${W-10}" y="${ry-5}" text-anchor="end" style="fill:var(--crit)">média do teto: ${kfmt(ref)}/mês</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento PJ por mês">${g}</svg>`}

/* ---------- CARTÕES ---------- */
function vCartoes(){const m=S.month,C=cfg();
  const cards=C.cartoes.map(k=>{const it=itens(m).filter(x=>x.conta===k.id&&x.tipo==='despesa').sort((a,b)=>a.dia-b.dia);const f=sum(it,x=>x.valor);
   const hist=[];for(let i=5;i>=0;i--){const ym=addM(m,-i);hist.push([ym,sum(itens(ym).filter(x=>x.conta===k.id&&x.tipo==='despesa'),x=>x.valor)])}
   return `<div class="card"><div class="card-h"><h2>${esc(k.nome)} ${badge(k.ent)}</h2><span class="meta">${k.vence?'vence dia '+k.vence:''}${k.fecha?' · fecha dia '+k.fecha:''}</span></div>
   <div class="kpi"><div class="lab">Fatura de ${mLabel(m)}</div><div class="val">${brl(f)}</div>${k.limite?`<div class="det">${pct(f/k.limite)} do limite de ${brl0(k.limite)}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,f/k.limite*100)}%;background:${f>k.limite?'var(--crit)':f>k.limite*.8?'var(--warn)':'var(--accent)'}"></i></div>`:'<div class="det">Limite não informado (Ajustes)</div>'}</div>
   <div class="list" style="margin-top:12px">${it.map(x=>`<div class="row" data-act="edit" data-id="${esc(x.id)}" style="cursor:pointer"><span class="d">dia ${esc(x.dia)}</span><div class="t"><div>${esc(x.desc)}</div><small>${esc(x.cat)}${x.parc?' · '+esc(x.parc):''}</small></div><span class="v">${brl(x.valor)}</span><span></span></div>`).join('')||'<div class="empty">Nenhuma compra lançada neste cartão.</div>'}</div>
   <div class="inline" style="margin-top:12px"><button class="btn sm" data-act="novo" data-conta="${esc(k.id)}">+ Compra neste cartão</button><span class="small muted">Últimos 6 meses: ${hist.map(([ym,v])=>`${mShort(ym)} ${v?kfmt(v):'—'}`).join(' · ')}</span></div></div>`}).join('');
  return header('Cartões','Cada compra no cartão é um gasto da categoria dela. A fatura é a soma do que você lançou.',monthCtl())+
  `<div class="alert a-info" style="margin-bottom:14px"><span class="ic">i</span><div><b>Como sair da “fatura a detalhar”</b><p>Hoje cada cartão entra como um valor único. Ao lançar uma compra no cartão, diminua o valor da linha “Fatura … (a detalhar)” no mesmo tanto. Em um ou dois meses, a fatura inteira fica separada por categoria e o painel passa a mostrar onde o dinheiro vai de fato.</p></div></div>
  <div class="grid g2">${cards||'<div class="card empty">Cadastre seus cartões em Ajustes.</div>'}</div>`}

/* ---------- METAS ---------- */
function vMetas(){const C=cfg(),mg=mediaGastosPF(S.month);
  const cards=C.metas.map(g=>{const s=metaSaldo(g),p=g.alvo?Math.min(1,s/g.alvo):0,falta=Math.max(0,g.alvo-s),meses=g.aporte>0?Math.ceil(falta/g.aporte):null;
   const aps=[];for(const m of Object.keys(S.meses).sort().reverse()){for(const x of itens(m))if(x.tipo==='transf'&&(x.para==='meta:'+g.id||x.de==='meta:'+g.id))aps.push([m,x])}
   return `<div class="card goal"><div class="card-h" style="margin:0"><h2>${esc(g.nome)} ${badge(g.ent)}</h2><button class="btn sm ghost" data-act="meta-edit" data-id="${esc(g.id)}">Editar</button></div>

   <div class="bar"><i style="width:${(p*100).toFixed(1)}%"></i></div>
   <div class="nums"><span>Aporte planejado: ${brl(g.aporte)}/mês</span><span>${falta?(meses?`chega lá em ~${meses} ${meses===1?'mês':'meses'} (${mLabel(addM(curYM,meses))})`:'defina um aporte'):'meta batida'}</span></div>
   ${g.ent==='PF'&&mg?`<div class="small muted">Cobre ${(s/mg).toLocaleString('pt-BR',{maximumFractionDigits:1})} meses dos seus gastos pessoais (média ${brl0(mg)}).</div>`:''}
   ${g.nota?`<div class="small muted">${esc(g.nota)}</div>`:''}
   <div class="inline"><button class="btn sm pri" data-act="aporte" data-meta="${esc(g.id)}">Registrar aporte</button><button class="btn sm" data-act="resgate" data-meta="${esc(g.id)}">Registrar resgate</button></div>
   ${aps.length?`<div class="list small">${aps.slice(0,6).map(([m,x])=>`<div class="row" style="grid-template-columns:70px 1fr auto"><span class="d">${mShort(m)}</span><span>${esc(x.desc)}</span><span class="v ${x.de==='meta:'+g.id?'neg':'pos'}">${x.de==='meta:'+g.id?'−':'+'} ${brl(x.valor)}</span></div>`).join('')}</div>`:''}</div>`}).join('');
  return header('Metas e reserva','O dinheiro guardado sai do mês como transferência, não como gasto.','<button class="btn pri" data-act="meta-novo">+ Nova meta</button>')+`<div class="grid g2">${cards||'<div class="card empty">Nenhuma meta ainda.</div>'}</div>`}

/* ---------- HISTÓRICO ---------- */
function vHist(){const keys=new Set([...Object.keys(S.hist),...Object.keys(S.meses).filter(m=>itens(m).length)]);const all=[...keys].sort();
  if(!all.length)return header('Histórico')+'<div class="card empty">Sem histórico ainda.</div>';
  let start=all[0];const end=all[all.length-1];if(S.histRange==='3a')start=addM(end,-35);if(S.histRange==='1a')start=addM(end,-11);if(start<all[0])start=all[0];
  const pts=[];for(let m=start;m<=end;m=addM(m,1))pts.push({ym:m,v:serie(m)});
  const years={};for(const m of all){const s=serie(m);if(!s)continue;const y=m.slice(0,4);years[y]=years[y]||{r:0,g:0,n:0};years[y].r+=s.r;years[y].g+=s.g;years[y].n++}
  const ys=Object.keys(years).sort().reverse();
  return header('Histórico',`${mLabel(all[0])} a ${mLabel(end)} · ${all.length} meses registrados`,`<div class="seg">${[['1a','12 meses'],['3a','3 anos'],['tudo','Tudo']].map(([v,l])=>`<button class="${S.histRange===v?'on':''}" data-act="hrange" data-v="${v}">${l}</button>`).join('')}</div>`)+
  `<div class="card"><div class="card-h"><h2>Receitas e gastos mês a mês</h2><span class="meta">meses antigos importados da planilha; passe o mouse para ver cada mês</span></div>${LEGEND}${lineChart(pts)}</div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h2>Ano a ano</h2><span class="meta">PF + PJ somados</span></div><div class="table-wrap"><table><thead><tr><th>Ano</th><th class="num">Meses</th><th class="num">Receitas</th><th class="num">Gastos</th><th class="num">Resultado</th><th class="num">Receita média/mês</th><th class="num">Gasto médio/mês</th></tr></thead><tbody>
  ${ys.map(y=>{const o=years[y],res=o.r-o.g;return `<tr><td><b>${y}</b></td><td class="num muted">${o.n}</td><td class="num">${brl0(o.r)}</td><td class="num">${brl0(o.g)}</td><td class="num ${res>=0?'pos':'neg'}">${brl0(res)}</td><td class="num">${brl0(o.r/o.n)}</td><td class="num">${brl0(o.g/o.n)}</td></tr>`}).join('')}</tbody></table></div></div>`}

  const orc=Object.entries(C.orcamento||{}).map(([k,v])=>{const [e,c]=k.split('|');return `<span class="chip">${badge(e)} ${esc(c)}: ${brl0(v)}<button data-act="orc-del" data-k="${esc(k)}" aria-label="Remover limite">×</button></span>`}).join('');

  `<div class="stack">

    <div class="fld"><label for="a-lim">Teto anual de faturamento</label><input id="a-lim" name="limitePJ" value="${numIn(C.limitePJ)}" inputmode="decimal"></div>

    <div><button class="btn pri">Salvar</button></div></form>

let MODAL=null;
function openModal(o){MODAL=o;const el=$('#modal');el.innerHTML=`<div class="dlg"><form id="mf" novalidate><header><h2>${o.title}</h2><button type="button" class="ib" data-act="close" aria-label="Fechar">✕</button></header><div class="body" id="mbody">${o.body()}</div><footer><div>${o.onDelete?'<button type="button" class="btn danger" data-act="mdel">Excluir</button>':''}</div><div class="inline"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri">${o.ok||'Salvar'}</button></div></footer></form></div>`;el.classList.add('on');const f=el.querySelector('input:not([type=hidden]),select');if(f)setTimeout(()=>f.focus(),30)}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';MODAL=null}
function fdObj(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked);return o}
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(l)}</option>`;

function itemModal(orig,m,preset){let st=Object.assign({tipo:'despesa',ent:S.esc==='PJ'?'PJ':'PF',dia:orig?orig.dia:(m===curYM?today.getDate():1),status:'pago',mes:m},preset||{},orig?clone(orig):{});st.mes=m;
  if(st.tipo==='transf'){st.de=st.de||'PJ';st.para=st.para||'PF'}

    const cats=t==='transf'?[]:(C.categorias[e][t]||[]);if(st.cat&&!cats.includes(st.cat))cats.unshift(st.cat);
    const contas=[...C.contas.filter(c=>c.ent===e),...(t==='despesa'?C.cartoes.filter(c=>c.ent===e):[])];

    <div class="fld"><label for="m-desc">Descrição</label><input id="m-desc" name="desc" value="${esc(st.desc||'')}" required placeholder="${t==='transf'?'Ex.: Retirada de lucro':'Ex.: Mercado da semana'}"></div>
    <div class="three"><div class="fld"><label for="m-val">Valor (R$)</label><input id="m-val" name="valor" value="${st.valor!=null?numIn(st.valor):''}" inputmode="decimal" required placeholder="0,00"></div>

     ${(st.conta===WISE||(!st.conta&&contas[0]&&contas[0].id===WISE))?`<div class="fld"><label for="m-eur">Valor em euro (opcional)</label><input id="m-eur" name="eur" value="${st.eur!=null?numIn(st.eur):''}" inputmode="decimal" placeholder="ex.: 445,00"><span class="hint">Se deixar vazio, uso a cotação de hoje (R$ ${numIn(cot())}).</span></div>`:''}

    onChange(){sync();$('#mbody').innerHTML=body()},

      if(orig&&orig.recId)it.recId=orig.recId;

      toast(orig?'Lançamento atualizado.':'Lançamento salvo em '+mLabel(o.mes)+'.');return true},

function textModal(title,text,hint){openModal({title,ok:'Copiar',body:()=>`<p class="hint" style="margin:0">${hint}</p><div class="fld"><textarea id="t-txt" readonly>${esc(text)}</textarea></div>`,
  onSubmit(){const ta=$('#t-txt');ta.select();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('Copiado.'),()=>toast('Selecione o texto e copie com Ctrl+C.'))}else toast('Selecione o texto e copie com Ctrl+C.');return false}})}
function toCSV(list){const h=['mes','dia','descricao','valor','tipo','escopo','categoria','conta','situacao','cliente','parcela','de','para','observacao'];
  const q=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [h.join(';'),...list.map(([m,x])=>[m,x.dia,x.desc,String(x.valor).replace('.',','),x.tipo,x.ent,x.cat||'',x.tipo==='transf'?'':contaNome(x.conta),x.status||'',x.cliente?((cliente(x.cliente)||{}).nome||x.cliente):'',x.parc||'',x.de?lugarNome(x.de):'',x.para?lugarNome(x.para):'',x.nota||''].map(q).join(';'))].join('\n')}

const CFGS=window.FINANCEIRO||{};
const sb=window.supabase&&CFGS.supabaseUrl?window.supabase.createClient(CFGS.supabaseUrl,CFGS.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}}):null;
function supaDb(uidv){let cache=null,loading=null;
  const loadAll=async()=>{const {data,error}=await sb.from('fin_docs').select('path,data').limit(5000);if(error)throw {code:'unavailable',message:error.message};cache={};for(const r of data)cache[r.path]=r.data;return cache};
  const ready=()=>loading||(loading=loadAll());
  const snap=p=>{const d=cache&&cache[p];return {id:p.split('/').pop(),exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}};
  const errOf=e=>({code:/row-level|permission|policy|jwt/i.test(e.message||'')?'invalid_argument':'unavailable',message:e.message});
  return {
    doc(p){return {path:p,
      async set(d){const {error}=await sb.from('fin_docs').upsert({user_id:uidv,path:p,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id,path'});if(error)throw errOf(error);if(cache)cache[p]=d},
      async get(){await ready();return snap(p)},
      onSnapshot(next,err){ready().then(()=>next(snap(p))).catch(e=>err&&err(e));return ()=>{}}}},
    collection(c){return {path:c,onSnapshot(next,err){ready().then(()=>{const docs=Object.keys(cache).filter(k=>k.startsWith(c+'/')&&k.split('/').length===2).map(snap);next({docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.map(d=>({type:'added',doc:d})),metadata:{fromCache:false,hasPendingWrites:false}})}).catch(e=>err&&err(e));return ()=>{}}}}
  }}

/* ---------- conexão ---------- */
route();
function maybeImport(){if(S.impData&&S.cfg&&!S.cfg.importado&&!S.imp&&S.db&&!S._impTried){S._impTried=true;setTimeout(importarPlanilha,400)}}
try{fetch('https://economia.awesomeapi.com.br/json/last/EUR-BRL').then(r=>r.ok?r.json():null).then(j=>{const v=j&&j.EURBRL&&Number(j.EURBRL.bid);if(v>3&&v<15){S.cotLive=v;if(S.ready)render()}}).catch(()=>{})}catch(_){}
(async()=>{let db=null;
  if(!sb){S.err='nodb';render();return}
  const {data:sess}=await sb.auth.getSession();
  if(!sess||!sess.session){S.err='login';renderNav();$('#main').innerHTML=loginView();$('#savestate').innerHTML='';return}
  db=supaDb(sess.session.user.id);S.userEmail=sess.session.user.email;
  S.db=db;setSave();let gotCfg=false,gotMeses=false;
  const timer=setTimeout(()=>{if(!S.ready){S.slow=true;render()}},10000);
  const check=()=>{if(gotCfg&&gotMeses&&!S.ready){S.ready=true;S.slow=false;clearTimeout(timer);maybeImport()}render()};
  const fail=e=>{clearTimeout(timer);if(!S.ready){S.err=(e&&e.code)||'erro';render()}else toast('A conexão com seus dados caiu. Recarregue a página.')};
  db.doc('cfg/main').onSnapshot(s=>{if(!s.metadata.hasPendingWrites||!S.cfg)S.cfg=s.exists?clone(s.data()):null;gotCfg=true;if(!MODAL)check();else if(!S.ready)check()},fail);
  db.doc('cfg/hist').onSnapshot(s=>{S.hist=s.exists?((s.data()||{}).meses||{}):{};if(S.ready&&!MODAL)render()},()=>{});
  db.collection('meses').onSnapshot(q=>{for(const ch of q.docChanges()){if(ch.type==='removed')delete S.meses[ch.doc.id];else if(!(Q['meses/'+ch.doc.id]&&Q['meses/'+ch.doc.id].busy))S.meses[ch.doc.id]=clone(ch.doc.data())}gotMeses=true;if(!MODAL)check();else if(!S.ready)check()},fail);
})();
})();
</script>
</body>
</html>
